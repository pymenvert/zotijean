name: Tests

# Le développement se fait sur Windows alors que la cible est macOS. Cette CI
# est le seul endroit où le code s'exécute réellement sur un Mac avant qu'il
# n'arrive chez l'utilisateur : elle attrape les différences de séparateur de
# chemin, de normalisation Unicode et de comportement du système de fichiers que
# le poste de développement ne peut pas révéler.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée annule l'exécution précédente sur la même branche. Sans
# ça, plusieurs exécutions périmées continuent de tourner en parallèle — et si
# l'une d'elles se fige, elle occupe un serveur pendant des heures pour un code
# déjà remplacé.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # SANS CETTE LIMITE, un travail qui se fige tourne SIX HEURES avant que
    # GitHub ne l'arrête — c'est le plafond par défaut. Six heures pendant
    # lesquelles on croit que « ça compile » alors que rien n'avance. La suite
    # complète prend moins d'une minute : dix, c'est déjà très large.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Aucune dépendance npm : il n'y a rien à installer, donc rien à mettre
      # en cache. Si un `npm install` devient nécessaire un jour, c'est que le
      # principe « zéro dépendance » a été abandonné — le vérifier explicitement.
      - name: Vérifier l'absence de dépendances
        shell: bash
        run: |
          if [ -d node_modules ]; then
            echo "node_modules ne doit pas être versionné." && exit 1
          fi
          node -e "
            const p = require('./package.json');
            const n = Object.keys(p.dependencies||{}).length + Object.keys(p.devDependencies||{}).length;
            if (n > 0) { console.error('Dépendances introuvables dans le principe du projet :', n); process.exit(1); }
            console.log('Zéro dépendance : conforme.');
          "

      - name: Vérifier la syntaxe de chaque module
        shell: bash
        run: |
          for fichier in server.js src/*.js; do
            node --check "$fichier" || exit 1
          done
          echo "Tous les modules se parsent."

      # Les journaux d'exécution de GitHub exigent une connexion, même sur un
      # dépôt public. Les annotations, elles, sont lisibles par tout le monde et
      # par l'API. On y recopie donc le détail des échecs : sans ça, une CI rouge
      # est indiagnosticable depuis un poste qui n'est pas connecté à GitHub.
      - name: Lancer les tests
        shell: bash
        run: |
          # GARDE-TEMPS PROPRE À L'ÉTAPE, indispensable pour diagnostiquer.
          #
          # Quand c'est le TRAVAIL entier qui atteint sa limite, GitHub le tue
          # net : le code de remontée d'erreurs ci-dessous ne s'exécute jamais,
          # et on ne sait rien de plus qu'« il s'est figé ». En surveillant
          # nous-mêmes, on reprend la main et on peut dire OÙ ça s'est arrêté.
          #
          # `timeout` n'existe pas sur macOS : on surveille donc à la main, ce
          # qui marche sur les deux systèmes.
          # Le lanceur de tests crée des processus enfants. Tuer le seul
          # superviseur les laisserait orphelins, à tourner en rond : on lance
          # donc dans une SESSION séparée pour pouvoir tuer tout le groupe.
          #
          # `setsid` n'existe QUE sous Linux : l'appeler sans précaution faisait
          # échouer l'étape sur macOS et Windows avant même d'avoir lancé un
          # seul test.
          if command -v setsid >/dev/null 2>&1; then
            setsid node --test --test-force-exit --test-reporter=tap > resultat.tap 2>&1 &
          else
            node --test --test-force-exit --test-reporter=tap > resultat.tap 2>&1 &
          fi
          TESTS=$!
          ( sleep 300; kill -9 -$TESTS 2>/dev/null || kill -9 $TESTS 2>/dev/null ) &
          GARDE=$!

          set +e
          wait $TESTS
          CODE=$?
          set -e
          kill $GARDE 2>/dev/null || true

          if [ $CODE -eq 137 ] || [ $CODE -eq 143 ]; then
            echo "--- Les tests ne se sont pas terminés en 5 minutes ---"
            cat resultat.tap
            dernier=$(grep -E "^(ok|not ok) " resultat.tap | tail -1)
            total=$(grep -cE "^(ok|not ok) " resultat.tap || echo 0)
            message=$(printf 'Les tests ne rendent pas la main sur %s.%%0A%%0ADernier test terminé (%s au total) :%%0A%s%%0A%%0ALe blocage suit ce test, ou se produit après la fin de la suite.' \
                      "${{ matrix.os }}" "$total" "$dernier")
            echo "::error title=Suite de tests figée::${message}"
            exit 1
          fi

          if [ $CODE -eq 0 ]; then
            tail -12 resultat.tap

            # GARDE-FOU. Les tests d'intégration ne s'exécutent que hors Windows.
            # Une panne totale de la synchronisation est passée inaperçue parce
            # qu'ils ne tournaient nulle part : mal appelés, ils étaient sautés
            # partout sans que le rapport ne le montre. Une CI verte qui ne teste
            # rien est pire qu'une CI rouge.
            if [ "${{ runner.os }}" != "Windows" ]; then
              temoin="une synchronisation complète télécharge, range et recense"
              # Le numéro du test dépend de sa place dans la suite : le figer à
              # « ok 1 » faisait échouer le garde-fou alors que tout passait.
              if ! grep -qE "^ok [0-9]+ - $temoin\$" resultat.tap; then
                echo "::error title=Tests d'intégration non exécutés::Le test « $temoin » n'a pas tourné sur ${{ matrix.os }}. La suite ne valide donc pas la chaîne de synchronisation."
                grep -F "$temoin" resultat.tap || echo "(test introuvable dans le rapport)"
                exit 1
              fi
              echo "Tests d'intégration confirmés exécutés."
            fi
            exit 0
          fi

          echo "--- Rapport complet ---"
          cat resultat.tap

          resume=$(grep -E "^not ok" resultat.tap | head -15 | sed 's/^/• /')
          detail=$(grep -A 12 -m 1 "^not ok" resultat.tap)
          message=$(printf '%s\n\nPremier échec en détail :\n%s' "$resume" "$detail" \
                    | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Tests en échec sur ${{ matrix.os }}::${message}"
          exit 1

  demarrage:
    name: Démarrage réel — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Ce travail télécharge les outils à embarquer (plusieurs centaines de
    # mégaoctets) et compile la coquille Swift : il lui faut plus de marge que
    # la suite de tests, mais pas six heures.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Les tests unitaires ne lancent jamais le serveur. Ce travail vérifie que
      # l'app démarre vraiment, sert son interface et répond à son API — c'est ce
      # qui attrape un import cassé ou un chemin qui n'existe que sur Windows.
      - name: Démarrer le serveur et interroger l'API
        shell: bash
        env:
          ZOTIJEAN_DONNEES: ${{ runner.temp }}/zotijean
        run: |
          node server.js --port 8799 --sans-navigateur &
          PID=$!

          for tentative in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:8799/api/tableau-de-bord"; then
              break
            fi
            sleep 1
          done

          echo "--- L'interface est servie ---"
          curl -sf "http://127.0.0.1:8799/" | grep -q "Zotijean" || { echo "Interface absente"; exit 1; }

          echo "--- L'API répond ---"
          curl -sf "http://127.0.0.1:8799/api/catalogue" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              const c = JSON.parse(d);
              if (!c.schémas?.length) { console.error('Catalogue vide'); process.exit(1); }
              // Chaque option doit porter son explication : c'est une règle du
              // projet, pas un détail cosmétique.
              for (const groupe of ['schémas','formats','qualités','rythmes','politiquesRetrait']) {
                for (const option of c[groupe]) {
                  if (groupe !== 'intervalles' && !option.explication) {
                    console.error('Option sans explication :', groupe, option.id); process.exit(1);
                  }
                }
              }
              console.log('Catalogue conforme :', c.schémas.length, 'schémas de rangement.');
            });
          "

          echo "--- La notice et sa feuille de style sont servies ---"
          # Régression déjà rencontrée : la politique de sécurité du contenu
          # interdit les styles en ligne, donc la notice DOIT charger un fichier
          # CSS séparé. Sans ce contrôle, elle se réafficherait un jour en texte
          # brut sans que personne ne s'en aperçoive.
          curl -sf "http://127.0.0.1:8799/notice.html" | grep -q 'rel="stylesheet"' \
            || { echo "La notice n'utilise pas de feuille de style externe : la politique de sécurité la rendrait illisible."; exit 1; }
          curl -sf "http://127.0.0.1:8799/notice.html" | grep -q '<style>' \
            && { echo "La notice contient un bloc <style> en ligne, que la politique de sécurité bloque."; exit 1; }
          curl -sf -o /dev/null "http://127.0.0.1:8799/notice.css" \
            || { echo "notice.css est introuvable."; exit 1; }

          echo "--- Une requête croisée est refusée ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Origin: https://site-malveillant.example" \
            "http://127.0.0.1:8799/api/synchroniser")
          if [ "$code" != "403" ]; then
            echo "Attendu 403, obtenu $code — la protection contre les requêtes croisées ne fonctionne pas."
            exit 1
          fi

          echo "--- Un faux en-tête Host est refusé ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: evil.example" \
            "http://127.0.0.1:8799/api/config")
          if [ "$code" != "403" ]; then
            echo "Attendu 403, obtenu $code — la protection contre le réattachement DNS ne fonctionne pas."
            exit 1
          fi

          kill $PID 2>/dev/null || true
          echo "Démarrage vérifié."

      - name: Vérifier la reprise du port, et qu'un programme étranger est épargné
        shell: bash
        env:
          ZOTIJEAN_DONNEES: ${{ runner.temp }}/zotijean-port
        run: |
          # Après un plantage, un moteur peut rester en écoute : l'application
          # doit pouvoir reprendre sa place. Mais tuer à l'aveugle ce qui occupe
          # un port arrêterait le programme de quelqu'un d'autre — c'est cette
          # seconde moitié qui compte le plus.

          echo "--- Un moteur abandonné est remplacé ---"
          node server.js --port 8796 --sans-navigateur &
          PREMIER=$!
          for i in $(seq 1 20); do
            curl -sf -o /dev/null "http://127.0.0.1:8796/api/identite" && break; sleep 1
          done

          node server.js --port 8796 --sans-navigateur &
          SECOND=$!
          sleep 10

          curl -sf -o /dev/null "http://127.0.0.1:8796/api/tableau-de-bord" \
            || { echo "::error::Le second moteur n'a pas pu reprendre le port."; exit 1; }
          if kill -0 $PREMIER 2>/dev/null; then
            kill -9 $PREMIER $SECOND 2>/dev/null || true
            echo "::error::Le moteur abandonné n'a pas été remplacé."; exit 1
          fi
          kill -9 $SECOND 2>/dev/null || true

          echo "--- Un programme étranger n'est PAS touché ---"
          node -e "require('http').createServer((q,r)=>{r.writeHead(200);r.end('etranger')}).listen(8794,'127.0.0.1')" &
          ETRANGER=$!
          sleep 3

          set +e
          node server.js --port 8794 --sans-navigateur
          CODE=$?
          set -e

          if [ $CODE -eq 0 ]; then
            kill -9 $ETRANGER 2>/dev/null || true
            echo "::error::Zotijean a démarré sur un port occupé par un tiers."; exit 1
          fi
          if ! kill -0 $ETRANGER 2>/dev/null; then
            echo "::error title=Programme tiers arrêté::Zotijean a tué un programme qui n'est pas le sien pour récupérer son port."
            exit 1
          fi

          kill -9 $ETRANGER 2>/dev/null || true
          echo "Reprise du port sûre : le nôtre est remplacé, celui des autres est épargné."

      - name: Vérifier l'arrêt automatique quand l'application hôte disparaît
        shell: bash
        env:
          ZOTIJEAN_DONNEES: ${{ runner.temp }}/zotijean-orphelin
        run: |
          # Un « forcer à quitter » ou un plantage de la coquille macOS n'envoie
          # AUCUN signal, et macOS ne tue pas les enfants avec leur parent : sans
          # cette surveillance, un téléchargement continuerait indéfiniment,
          # invisible, en gardant le port occupé.
          node -e "setTimeout(() => {}, 600000)" &
          PARENT=$!

          ZOTIJEAN_PARENT=$PARENT node server.js --port 8795 --sans-navigateur &
          MOTEUR=$!

          for i in $(seq 1 20); do
            curl -sf -o /dev/null "http://127.0.0.1:8795/api/tableau-de-bord" && break
            sleep 1
          done
          curl -sf -o /dev/null "http://127.0.0.1:8795/api/tableau-de-bord" \
            || { echo "Le moteur n'a pas démarré."; exit 1; }

          kill -9 $PARENT 2>/dev/null || true

          for i in $(seq 1 20); do
            kill -0 $MOTEUR 2>/dev/null || break
            sleep 1
          done

          if kill -0 $MOTEUR 2>/dev/null; then
            kill -9 $MOTEUR 2>/dev/null || true
            echo "::error title=Moteur orphelin::Le moteur a survécu à la disparition de son application hôte. Un téléchargement continuerait en fond, invisible, et le port resterait occupé."
            exit 1
          fi

          echo "Le moteur s'arrête bien avec son application hôte."

      - name: Compiler la coquille de barre des menus
        if: runner.os == 'macOS'
        run: |
          # Le développement se fait sur Windows : ce travail est le SEUL endroit
          # où le code Swift est réellement compilé. Sans lui, une erreur d'API
          # ne serait découverte que sur le Mac de l'utilisateur.
          cd macos
          swift build -c release
          echo "Coquille macOS compilée."

      - name: Récupérer les outils à embarquer
        if: runner.os == 'macOS'
        run: |
          # Node, Python, ffmpeg et les paquets de zotify. C'est ce qui rend
          # l'application autonome : rien à installer sur le Mac de destination.
          cd macos
          chmod +x outils.sh

          # Comme pour les tests : les journaux exigent une connexion, donc on
          # recopie l'essentiel dans une annotation, seule chose lisible sans
          # être authentifié. Sans ça, « exit code 1 » est tout ce qu'on sait.
          set +e
          ./outils.sh 2>&1 | tee recuperation.log
          CODE=${PIPESTATUS[0]}
          set -e

          if [ $CODE -ne 0 ]; then
            # 60 lignes : la sortie de pip est verbeuse, et c'est précisément
            # son début qui porte la cause. Tronquer trop court obligeait à un
            # aller-retour d'une heure par tentative.
            detail=$(tail -60 recuperation.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Récupération des outils en échec::${detail}"
            exit 1
          fi

      - name: Vérifier que les outils embarqués fonctionnent vraiment
        if: runner.os == 'macOS'
        run: |
          # Embarquer un binaire ne prouve pas qu'il s'exécute : architecture,
          # bibliothèques manquantes, bit d'exécution perdu. On les lance.
          cd macos/outils
          ./node/node --version           || { echo "Node embarqué inutilisable"; exit 1; }
          ./python/bin/python3 --version  || { echo "Python embarqué inutilisable"; exit 1; }
          if [ -x ./ffmpeg/ffmpeg ]; then
            ./ffmpeg/ffmpeg -version >/dev/null || { echo "ffmpeg embarqué inutilisable"; exit 1; }
            echo "ffmpeg embarqué : opérationnel"
          else
            echo "::warning title=ffmpeg absent du paquet::L'application exigera un ffmpeg installé."
          fi
          if [ -x ./ffmpeg/ffprobe ]; then
            ./ffmpeg/ffprobe -version >/dev/null || { echo "ffprobe embarqué inutilisable"; exit 1; }
            echo "ffprobe embarqué : opérationnel"
          else
            echo "::warning title=ffprobe absent du paquet::L'export Rekordbox ignorera la durée des morceaux."
          fi
          test "$(ls -1 roues | wc -l)" -gt 0 || { echo "Aucun paquet zotify récupéré"; exit 1; }

          # L'ARCHITECTURE, ET POURQUOI ELLE COMPTE. La cible est un Mac Apple
          # Silicon. Un binaire Intel s'exécute sous Rosetta — que le Mac n'a pas
          # forcément, et qu'on ne peut pas demander d'installer sans renier le
          # « rien à installer ». C'est un piège réel : evermeet.cx, la source la
          # plus connue de ffmpeg pour macOS, annonce ne pas fournir d'arm64.
          # Ici on ne fait que constater et signaler ; c'est la publication qui
          # refuse de sortir un paquet non natif.
          for outil in node/node python/bin/python3 ffmpeg/ffmpeg ffmpeg/ffprobe; do
            [ -x "$outil" ] || continue
            ARCHS=$(lipo -archs "$outil" 2>/dev/null || echo inconnu)
            echo "  $outil : $ARCHS"
            case "$ARCHS" in
              *arm64*) ;;
              *) echo "::warning title=Binaire non Apple Silicon::$outil est en « $ARCHS » et exigera Rosetta.";;
            esac
          done
          echo "Outils embarqués vérifiés."

      - name: Monter zotify hors ligne, comme au premier lancement
        if: runner.os == 'macOS'
        env:
          ZOTIJEAN_DONNEES: ${{ runner.temp }}/zotijean-paquet
        run: |
          # Le test décisif : l'installation doit réussir SANS RÉSEAU, à partir
          # des seules roues du paquet. Si elle échoue, l'utilisateur se
          # retrouverait devant une app qui ne télécharge rien.
          set +e
          node -e "
            import('./src/outils.js').then(async (m) => {
              const r = await m.assurerZotify();
              console.log(JSON.stringify(r, null, 1));
              if (!r.prêt) { console.error('zotify n a pas pu etre monte'); process.exit(1); }
              const { exécuter } = await import('./src/processus.js');
              const v = await exécuter(r.chemin, ['--version'], { délaiMs: 60000 });
              console.log('zotify embarqué :', (v.stdout + v.stderr).trim().split('\n')[0]);
              if (v.code !== 0) { console.error('zotify ne repond pas'); process.exit(1); }
            }).catch((e) => { console.error(e); process.exit(1); });
          " 2>&1 | tee montage.log
          CODE=${PIPESTATUS[0]}
          set -e

          if [ $CODE -ne 0 ]; then
            detail=$(tail -25 montage.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Montage hors ligne de zotify en échec::${detail}"
            exit 1
          fi

      - name: Assembler et vérifier le paquet .app
        if: runner.os == 'macOS'
        run: |
          cd macos
          chmod +x construire.sh
          ./construire.sh
          APP="build/Zotijean.app"
          test -x "$APP/Contents/MacOS/Zotijean"       || { echo "Binaire absent"; exit 1; }
          test -f "$APP/Contents/Info.plist"           || { echo "Info.plist absent"; exit 1; }
          test -f "$APP/Contents/Resources/moteur/server.js" || { echo "Moteur absent du paquet"; exit 1; }
          test -f "$APP/Contents/Resources/moteur/public/index.html" || { echo "Interface absente"; exit 1; }
          # LSUIElement décide que l'app vit dans la barre des menus : sans lui,
          # elle apparaîtrait dans le Dock avec une fenêtre vide.
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist" | grep -q true \
            || { echo "LSUIElement manquant"; exit 1; }

          # Le paquet doit être AUTONOME : sans ces outils, double-cliquer ne
          # suffirait pas et l'app exigerait des installations.
          test -x "$APP/Contents/Resources/outils/node/node" \
            || { echo "Node absent du paquet : l'app ne demarrerait pas"; exit 1; }
          test -x "$APP/Contents/Resources/outils/python/bin/python3" \
            || { echo "Python absent du paquet"; exit 1; }
          test -d "$APP/Contents/Resources/outils/roues" \
            || { echo "Paquets zotify absents"; exit 1; }
          echo "Paquet .app autonome, $(du -sh "$APP" | cut -f1)."

      - name: Emballer en archive téléchargeable
        if: runner.os == 'macOS'
        run: |
          cd macos/build
          # ditto préserve les bits d'exécution et les liens symboliques, ce que
          # zip ne fait pas toujours : une archive mal faite donne une app qui
          # refuse de s'ouvrir.
          ditto -c -k --sequesterRsrc --keepParent Zotijean.app Zotijean.zip
          echo "Archive : $(du -sh Zotijean.zip | cut -f1)"

      - name: Publier l'application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Zotijean-app-macos
          path: macos/build/Zotijean.zip
          if-no-files-found: error

      - name: Vérifier que le lanceur macOS est exécutable et en LF
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Un script en CRLF échoue avec « bad interpreter: /bin/bash^M » et le
          # lanceur ne démarre tout simplement pas. Ce contrôle est la seule
          # façon de s'en apercevoir depuis un poste de développement Windows.
          if grep -q $'\r' "Zotijean - Mac.command"; then
            echo "Le lanceur contient des retours chariot : il ne démarrera pas sur macOS."
            exit 1
          fi
          if [ ! -x "Zotijean - Mac.command" ]; then
            echo "Le lanceur n'est pas exécutable : le double-clic ne fonctionnera pas."
            exit 1
          fi
          bash -n "Zotijean - Mac.command"
          echo "Lanceur macOS conforme."
