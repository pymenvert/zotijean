name: Publier une version

# Pourquoi ce workflow existe, en plus de celui des tests.
#
# Les artefacts d'une exécution ordinaire exigent d'être connecté à GitHub pour
# être téléchargés, et ils EXPIRENT au bout de 90 jours. C'est acceptable pour
# vérifier une construction, pas pour installer une application.
#
# Une « release » n'a ni l'une ni l'autre de ces limites : lien permanent,
# téléchargeable sans compte. C'est ce qu'on publie ici.
#
# Pour publier :   git tag v0.3.0 && git push origin v0.3.0
#
# Attendre la CI verte AVANT de taguer. Ce workflow relance bien la suite de
# tests (étape « Lancer les tests » plus bas) — mais sur une seule plateforme,
# Linux, alors que la CI ordinaire couvre aussi Windows et macOS. Un défaut
# propre à macOS passerait donc ici sans être vu, et le tag est irréversible.
#
# La phrase précédente affirmait que ce workflow ne rejoue pas les tests. C'était
# faux, et dans le sens dangereux : elle poussait à se croire moins couvert qu'on
# ne l'est, ce qui finit par faire ignorer l'étape.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour créer la release et y joindre le paquet

jobs:
  publier:
    name: Construire et publier
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lancer les tests
        run: node --test --test-force-exit

      - name: Récupérer les outils à embarquer
        run: |
          cd macos
          chmod +x outils.sh

          # Les journaux d'exécution exigent une connexion GitHub ; les
          # annotations, non. On y recopie l'essentiel, sinon « exit code 1 »
          # est tout ce qu'on saura d'une publication ratée.
          set +e
          ./outils.sh 2>&1 | tee recuperation.log
          CODE=${PIPESTATUS[0]}
          set -e

          if [ $CODE -ne 0 ]; then
            detail=$(tail -60 recuperation.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Récupération des outils en échec::${detail}"
            exit 1
          fi

      - name: Vérifier que zotify s'installe vraiment, sans réseau
        env:
          ZOTIJEAN_DONNEES: ${{ runner.temp }}/zotijean-publication
        run: |
          # Le test décisif : l'installation doit réussir à partir des seules
          # roues du paquet. Vérifier que le dossier n'est pas vide ne prouve
          # rien — on publierait une app qui ne télécharge rien.
          set +e
          node -e "
            import('./src/outils.js').then(async (m) => {
              const r = await m.assurerZotify();
              if (!r.prêt) { console.error('zotify n a pas pu etre monte'); process.exit(1); }
              const { exécuter } = await import('./src/processus.js');
              const v = await exécuter(r.chemin, ['--version'], { délaiMs: 60000 });
              console.log('zotify embarqué :', (v.stdout + v.stderr).trim().split('\n')[0]);
              if (v.code !== 0) { console.error('zotify ne repond pas'); process.exit(1); }
            }).catch((e) => { console.error(e); process.exit(1); });
          " 2>&1 | tee montage.log
          CODE=${PIPESTATUS[0]}
          set -e

          if [ $CODE -ne 0 ]; then
            detail=$(tail -25 montage.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=zotify inutilisable dans le paquet::${detail}"
            exit 1
          fi

      - name: Construire l'application
        run: |
          cd macos
          chmod +x construire.sh

          set +e
          ./construire.sh 2>&1 | tee construction.log
          CODE=${PIPESTATUS[0]}
          set -e

          if [ $CODE -ne 0 ]; then
            detail=$(tail -40 construction.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Construction du paquet en échec::${detail}"
            exit 1
          fi

      - name: Vérifier que le paquet est autonome
        run: |
          APP="macos/build/Zotijean.app"
          OUTILS="$APP/Contents/Resources/outils"

          # Un paquet publié qui exigerait une installation trahirait sa
          # promesse : on refuse de publier plutôt que de décevoir.
          manque() { echo "::error title=Paquet incomplet::$1"; exit 1; }

          test -x "$APP/Contents/MacOS/Zotijean"                     || manque "Le binaire de l'application est absent."
          test -f "$APP/Contents/Resources/moteur/server.js"         || manque "Le moteur est absent."
          test -f "$APP/Contents/Resources/moteur/public/index.html" || manque "L'interface est absente."

          # Les feuilles de style sont vérifiées une par une depuis que la
          # politique de sécurité du contenu interdit les styles en ligne : une
          # page dont la feuille manque ne s'affiche plus mal, elle s'affiche
          # NUE. retour.css est le cas sensible — c'est la page qui annonce si la
          # connexion à Spotify a abouti.
          for feuille in app.css notice.css retour.css; do
            test -f "$APP/Contents/Resources/moteur/public/$feuille" \
              || manque "La feuille de style $feuille est absente : la page correspondante s'afficherait sans aucune mise en forme."
          done
          test -x "$OUTILS/node/node"                                || manque "Node est absent : l'app exigerait une installation."
          test -x "$OUTILS/python/bin/python3"                       || manque "Python est absent : l'app exigerait une installation."
          test -d "$OUTILS/roues"                                    || manque "Le téléchargeur (zotify) est absent."
          ls "$OUTILS"/roues/*.whl >/dev/null 2>&1                   || manque "Le dossier des paquets zotify est vide."

          # ffmpeg est le seul outil dont l'absence DÉTRUIT des morceaux : zotify
          # renomme le fichier avant de constater qu'il manque, et ne le restaure
          # jamais. Il ne sort pas d'ici sans lui. ffprobe l'accompagne, c'est lui
          # qui lit la durée des morceaux pour l'export Rekordbox.
          test -x "$OUTILS/ffmpeg/ffmpeg"                            || manque "ffmpeg est absent. Sans lui, zotify détruit les morceaux en silence."
          test -x "$OUTILS/ffmpeg/ffprobe"                           || manque "ffprobe est absent : l'export Rekordbox serait incomplet."

          # La cible est un Mac Apple Silicon. Un binaire Intel fonctionnerait
          # sous Rosetta -- que le Mac n'a pas forcément, et qu'on ne peut pas
          # demander d'installer sans renier le « rien à installer ».
          for outil in node/node python/bin/python3 ffmpeg/ffmpeg ffmpeg/ffprobe; do
            ARCHS=$(lipo -archs "$OUTILS/$outil" 2>/dev/null || echo inconnu)
            case "$ARCHS" in
              *arm64*) ;;
              *) echo "::error title=Binaire non Apple Silicon::$outil est en « $ARCHS ». Il exigerait Rosetta."; exit 1;;
            esac
          done

          echo "Paquet autonome et natif Apple Silicon, $(du -sh "$APP" | cut -f1)."

      - name: Emballer
        run: |
          cd macos/build
          # ditto préserve les bits d'exécution et les liens symboliques : un zip
          # ordinaire produit une application que macOS refuse d'ouvrir.
          ditto -c -k --sequesterRsrc --keepParent Zotijean.app Zotijean.zip

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          # Un tag donne son nom à la version ; un déclenchement manuel produit
          # un brouillon, pour ne jamais publier par accident depuis un bouton.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          # gh est préinstallé sur les runners : pas d'action tierce à qui
          # confier un jeton d'écriture sur le dépôt.
          # LE TEXTE VIT DANS UN FICHIER, PAS ICI. Un document collé dans un
          # « run: | » doit rester indenté sous lui : la moindre ligne en
          # colonne 0 ferme le bloc, et GitHub rejette le fichier entier avant
          # d'avoir lancé le moindre travail. C'est arrivé, et ça ne se voit pas
          # à la relecture — le YAML paraît parfaitement normal.
          NOTES=$(mktemp)
          cat .github/notes-release.md > "$NOTES"

          # Le journal des versions détaille le reste ; on l'ajoute plutôt que
          # de le recopier, pour qu'il n'y ait qu'un seul texte à maintenir.
          if [ -f CHANGELOG.md ]; then
            printf '\n---\n\n' >> "$NOTES"
            # De la première section jusqu'à la suivante, sans son propre titre.
            # Découper « du premier ## jusqu'à l'avant-dernière ligne » paraît
            # équivalent et ne l'est pas : quand il n'y a qu'une seule section,
            # ça ampute la dernière phrase du fichier.
            awk '/^## /{n++; if (n==2) exit; if (n==1) next} n==1' CHANGELOG.md >> "$NOTES"
          fi

          if [ -n "$TAG" ]; then
            gh release create "$TAG" macos/build/Zotijean.zip \
              --title "Zotijean $TAG" --notes-file "$NOTES"
            echo "Version $TAG publiée."
          else
            # Sans tag (déclenchement manuel), on prépare sans rendre public.
            gh release create "brouillon-${GITHUB_RUN_NUMBER}" macos/build/Zotijean.zip \
              --draft --title "Brouillon $GITHUB_RUN_NUMBER" --notes-file "$NOTES"
            echo "Brouillon créé : rien n'est public tant qu'il n'est pas publié à la main."
          fi
